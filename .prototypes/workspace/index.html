<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GooeyPi workspace — prototype variants</title>
<style>
  :root {
    color-scheme: dark;
    --canvas: #171716;
    --sidebar: #20201f;
    --surface-subtle: #242423;
    --surface-hover: #2b2b29;
    --surface-selected: #333330;
    --surface-raised: #222220;
    --text: #f1f1ee;
    --text-secondary: #b3b3ad;
    --text-tertiary: #969690;
    --border: #343431;
    --border-strong: #474743;
    --focus: #82b5ff;
    --prime: #a595ff;
    --prime-soft: #312b51;
    --success: #75c897;
    --success-soft: #20392b;
    --warning: #deb967;
    --danger: #ed8a82;
    --annotation: #63aaff;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --shadow-popover: 0 10px 30px rgba(0, 0, 0, .32);
    font-size: 13px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--canvas);
    color: var(--text);
    font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", "SF Pro Text", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }
  .i { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--text-secondary); }
  .tertiary { color: var(--text-tertiary); }
  .tiny { font-size: 10.5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; background: var(--text-tertiary); }
  .dot.ok { background: var(--success); }
  .dot.run { background: var(--warning); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .spinner {
    width: 11px; height: 11px; flex: none; border-radius: 50%;
    border: 1.5px solid rgba(222, 185, 103, .25); border-top-color: var(--warning);
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .check { color: var(--success); }

  /* ---------- shells ---------- */
  #stage, .app { height: 100dvh; }
  .app { display: grid; overflow: hidden; }
  .restored { grid-template-columns: 248px minmax(0, 1fr) 420px; }
  .focus { grid-template-columns: 56px minmax(0, 1fr); }
  .ledger { grid-template-columns: 300px minmax(0, 1fr) 300px; }
  .side {
    min-height: 0; display: flex; flex-direction: column;
    background: var(--sidebar); border-right: 1px solid var(--border);
  }
  .side__title {
    height: 52px; flex: none; display: flex; align-items: center; gap: 8px;
    padding: 0 10px 0 12px;
  }
  .mark {
    width: 26px; height: 26px; flex: none; display: grid; place-items: center;
    border-radius: 7px; background: var(--surface-selected); color: var(--text);
    font-weight: 800; font-size: 9px; letter-spacing: .04em;
  }
  .brand { display: flex; align-items: center; gap: 7px; min-width: 0; padding: 3px 5px 3px 3px; border-radius: 8px; }
  .brand:hover { background: var(--surface-hover); }
  .brand__name { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.05; }
  .brand__name strong { font-size: 13px; letter-spacing: .02em; }
  .brand__name small { font-size: 8.5px; letter-spacing: .16em; color: var(--text-secondary); }
  .side__title .grow { flex: 1; }
  .icon-button {
    width: 28px; height: 28px; display: grid; place-items: center; flex: none;
    border-radius: 7px; color: var(--text-secondary);
  }
  .icon-button:hover { background: var(--surface-hover); color: var(--text); }
  .side__nav { display: grid; gap: 1px; padding: 2px 8px 8px; }
  .nav-row {
    height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 8px;
    border-radius: 7px; color: var(--text-secondary); font-size: 12.5px; text-align: left;
  }
  .nav-row:hover { background: var(--surface-hover); color: var(--text); }
  .nav-row .i { width: 14px; height: 14px; color: var(--text-tertiary); }
  .nav-row__label { flex: 1; }
  .badge {
    min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center;
    border-radius: 999px; background: var(--surface-selected); color: var(--text-secondary);
    font-size: 10px; font-variant-numeric: tabular-nums;
  }
  .side__section {
    padding: 10px 16px 4px; display: flex; align-items: center; gap: 6px;
    color: var(--text-tertiary); font-size: 10px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase;
  }
  .side__section .grow { flex: 1; }
  .side__section .icon-button { width: 22px; height: 22px; }
  .side__section .icon-button .i { width: 12px; height: 12px; }
  .tree { min-height: 0; flex: 1; overflow: auto; padding: 0 8px 12px; }
  .project-row {
    height: 29px; display: flex; align-items: center; gap: 7px; padding: 0 7px;
    border-radius: 7px; color: var(--text-secondary); font-size: 12px;
  }
  .project-row:hover { background: var(--surface-hover); color: var(--text); }
  .project-row .i { width: 13px; height: 13px; color: var(--text-tertiary); }
  .project-row__name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sessions { display: grid; gap: 1px; margin: 1px 0 4px 14px; }
  .session-row {
    min-height: 29px; display: flex; align-items: center; gap: 7px; padding: 0 7px;
    border-radius: 7px; color: var(--text-secondary); font-size: 11.5px; text-align: left;
  }
  .session-row:hover { background: var(--surface-hover); }
  .session-row.is-active { background: var(--surface-selected); color: var(--text); }
  .session-row__title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
  .session-row__state { font-size: 9.5px; color: var(--text-tertiary); }
  .side__footer { border-top: 1px solid var(--border); padding: 8px; display: grid; gap: 1px; }

  .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--canvas); }
  .topbar { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 18px; }
  .topbar__title { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 12.5px; }
  .topbar__title strong { font-weight: 600; }
  .branch {
    display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px;
    border: 1px solid var(--border); border-radius: 999px; color: var(--text-secondary); font-size: 10.5px;
  }
  .branch .i { width: 11px; height: 11px; }
  .topbar .grow { flex: 1; }
  .topbar__actions { display: flex; align-items: center; gap: 2px; }
  .topbar__actions .icon-button { color: var(--text-tertiary); }

  .convo { position: relative; min-height: 0; flex: 1; display: flex; flex-direction: column; }
  .scroll { min-height: 0; flex: 1; overflow: auto; }
  .thread { max-width: 880px; margin: 0 auto; padding: 26px 24px 16px; }
  .thread--wide { max-width: 100%; }
  .msg-user { display: flex; flex-direction: column; align-items: flex-end; padding-left: 14%; margin-bottom: 22px; }
  .bubble {
    max-width: min(88%, 640px); padding: 9px 13px; border-radius: 15px; border-bottom-right-radius: 5px;
    background: var(--surface-subtle); font-size: 14px; line-height: 1.55; overflow-wrap: anywhere;
  }
  .msg-assistant { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; margin-bottom: 20px; }
  .assistant-mark {
    width: 22px; height: 22px; margin-top: 2px; display: grid; place-items: center;
    border: 1px solid var(--border); border-radius: 6px; color: var(--text-secondary);
    font-size: 8px; font-weight: 800; letter-spacing: .02em;
  }
  .msg-body { min-width: 0; font-size: 14px; line-height: 1.62; }
  .prose p { margin: 0 0 11px; }
  .prose p:last-child { margin-bottom: 0; }
  .prose ul { margin: 0 0 11px; padding-left: 20px; }
  .prose li { margin: 2px 0; }
  .prose code, .inline-code {
    padding: 1px 5px; border: 1px solid var(--border); border-radius: 5px;
    background: var(--surface-subtle); font-family: var(--mono); font-size: 11.5px;
  }
  .tool-card {
    margin: 10px 0 12px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface-subtle); overflow: hidden;
  }
  .tool-card__head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 11.5px; }
  .tool-card__head .i { width: 13px; height: 13px; color: var(--text-tertiary); }
  .tool-card__cmd { font-family: var(--mono); color: var(--text-secondary); }
  .tool-card__state { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; color: var(--success); font-size: 10.5px; }
  .tool-card__out {
    padding: 8px 10px; border-top: 1px solid var(--border); color: var(--text-secondary);
    font-family: var(--mono); font-size: 10.5px; line-height: 1.6; white-space: pre-wrap;
  }
  .worked {
    display: flex; align-items: center; gap: 10px; margin: 4px 0 20px 38px;
    color: var(--text-tertiary); font-size: 10.5px;
  }
  .worked::before, .worked::after { height: 1px; flex: 1; background: var(--border); content: ''; }
  .worked span { flex: none; }
  .worked .i { width: 11px; height: 11px; }

  .composer-dock { flex: none; padding: 10px 20px 14px; }
  .composer {
    max-width: 880px; margin: 0 auto; padding: 7px; min-height: 104px;
    border: 1px solid var(--border-strong); border-radius: 14px; background: var(--surface-raised);
    box-shadow: 0 1px 3px rgba(0, 0, 0, .06); display: flex; flex-direction: column;
  }
  .composer__input {
    flex: 1; min-height: 55px; padding: 6px 9px; outline: 0; border: 0;
    color: var(--text); background: transparent; font-size: 14px; line-height: 1.5;
  }
  .composer__input:empty::before { content: attr(data-placeholder); color: var(--text-tertiary); }
  .composer__row { display: flex; align-items: center; gap: 6px; padding: 2px 2px 0; }
  .chip {
    height: 24px; display: inline-flex; align-items: center; gap: 5px; padding: 0 8px;
    border: 1px solid var(--border); border-radius: 7px; color: var(--text-secondary);
    font-size: 11px; white-space: nowrap;
  }
  .chip .i { width: 12px; height: 12px; }
  .chip--quiet { border-color: transparent; background: var(--surface-subtle); }
  .composer__row .grow { flex: 1; }
  .send {
    width: 28px; height: 28px; display: grid; place-items: center; border-radius: 999px;
    background: var(--text); color: var(--canvas);
  }
  .send .i { width: 14px; height: 14px; stroke-width: 2; }

  .inspect {
    min-height: 0; display: flex; flex-direction: column;
    background: var(--canvas); border-left: 1px solid var(--border);
  }
  .inspect__tabs {
    height: 42px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 10px;
    border-bottom: 1px solid var(--border); font-size: 11.5px;
  }
  .inspect__tab { height: 28px; padding: 0 9px; border-radius: 6px; color: var(--text-secondary); }
  .inspect__tab:hover { background: var(--surface-hover); }
  .inspect__tab.is-active { position: relative; color: var(--text); }
  .inspect__tab.is-active::after {
    position: absolute; left: 9px; right: 9px; bottom: -7px; height: 2px;
    border-radius: 2px; background: var(--text); content: '';
  }
  .inspect__body { min-height: 0; flex: 1; overflow: auto; padding: 16px 18px 40px; }
  .ready {
    display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px;
    border-radius: 6px; background: var(--success-soft); color: var(--success); font-size: 11px; font-weight: 600;
  }
  .inspect h2 { margin: 14px 0 6px; font-size: 18px; line-height: 1.25; }
  .inspect .lede { margin: 0 0 18px; color: var(--text-secondary); font-size: 12.5px; line-height: 1.55; }
  .inspect h3 {
    margin: 20px 0 8px; color: var(--text-tertiary); font-size: 10px;
    font-weight: 650; letter-spacing: .08em; text-transform: uppercase;
  }
  .detail { display: grid; gap: 1px; }
  .detail > div {
    min-height: 30px; display: grid; grid-template-columns: 110px minmax(0, 1fr);
    align-items: center; gap: 10px; font-size: 11.5px;
  }
  .detail dt { color: var(--text-secondary); }
  .detail dd { margin: 0; min-width: 0; display: flex; align-items: center; gap: 5px; overflow-wrap: anywhere; }
  .progress-list { display: grid; gap: 2px; }
  .progress-list > div { min-height: 28px; display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
  .progress-list .i { width: 13px; height: 13px; }
  .meter { display: grid; gap: 7px; font-size: 11px; }
  .meter__labels { display: flex; align-items: baseline; justify-content: space-between; }
  .meter progress { width: 100%; height: 5px; appearance: none; }
  .meter progress::-webkit-progress-bar { border-radius: 999px; background: var(--surface-selected); }
  .meter progress::-webkit-progress-value { border-radius: 999px; background: var(--prime); }
  .stat { display: flex; align-items: baseline; justify-content: space-between; font-size: 11.5px; }
  .stat strong { font-size: 13px; font-variant-numeric: tabular-nums; }

  .orb {
    position: absolute; right: 22px; bottom: 128px; width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e7d7ff, #b58cff 38%, #6f4bd6 72%, #2c1f66);
    box-shadow: 0 0 24px rgba(150, 110, 255, .45), inset 0 0 12px rgba(255, 255, 255, .35);
  }
  .orb::after {
    position: absolute; inset: 10px; border-radius: 50%;
    background: radial-gradient(circle at 60% 65%, rgba(255,255,255,.5), transparent 62%);
    content: '';
  }

  /* ---------- Focus variant ---------- */
  .rail {
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0;
    background: var(--sidebar); border-right: 1px solid var(--border);
  }
  .rail .mark { margin-bottom: 8px; }
  .rail .icon-button { width: 32px; height: 32px; }
  .rail .grow { flex: 1; }
  .focus .topbar { height: 60px; padding: 0 26px; }
  .focus .topbar__title { font-size: 13px; }
  .focus .thread { max-width: 760px; padding: 22px 30px 12px; }
  .focus .msg-body { font-size: 14.5px; line-height: 1.68; }
  .focus .bubble { background: var(--surface-raised); border: 1px solid var(--border); }
  .focus .composer { max-width: 760px; min-height: 112px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
  .focus .composer-dock { padding: 10px 30px 22px; }
  .focus .pill-summary {
    display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px;
    border: 1px solid var(--border); border-radius: 999px; color: var(--text-secondary); font-size: 11px;
  }
  .focus .tool-card { border-color: transparent; background: transparent; border-left: 2px solid var(--border-strong); border-radius: 0 8px 8px 0; }
  .focus .worked { margin-left: 38px; }
  .focus .orb { right: 26px; bottom: 150px; }

  /* ---------- Ledger variant ---------- */
  .ledger .side__title { height: 44px; padding-left: 12px; }
  .ledger .side__nav { padding-top: 0; }
  .ledger .nav-row { height: 27px; font-size: 12px; }
  .ledger .tree { padding: 0 6px 10px; }
  .ledger .project-row { height: 26px; }
  .ledger .session-row {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; min-height: 27px;
    padding: 0 7px; font-size: 11px; text-align: left;
  }
  .ledger .session-row__title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ledger .session-row__state { font-family: var(--mono); font-size: 9px; }
  .ledger .topbar { height: 44px; border-bottom: 1px solid var(--border); padding: 0 18px; }
  .ledger .thread { max-width: 100%; padding: 18px 26px 10px; }
  .ledger .msg-assistant { grid-template-columns: minmax(0, 1fr); gap: 0; margin-bottom: 16px; }
  .ledger .assistant-mark { display: none; }
  .ledger .meta-line {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    color: var(--text-tertiary); font-family: var(--mono); font-size: 9.5px; letter-spacing: .02em;
  }
  .ledger .meta-line .dot { width: 5px; height: 5px; }
  .ledger .bubble { border-radius: 10px; border: 1px solid var(--border); background: var(--surface-subtle); }
  .ledger .tool-card { border-radius: 8px; background: var(--canvas); border-color: var(--border); }
  .ledger .tool-card__head { font-family: var(--mono); font-size: 10.5px; }
  .ledger .composer-dock { padding: 8px 18px 12px; }
  .ledger .composer { max-width: 100%; min-height: 90px; border-radius: 10px; }
  .ledger .composer__input { min-height: 44px; font-size: 13px; }
  .ledger .rail-stats { min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 16px; border-left: 1px solid var(--border); background: var(--sidebar); }
  .ledger .rail-stats h3 { margin: 0; color: var(--text-tertiary); font-size: 9.5px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; }
  .ledger .stat-block { display: grid; gap: 6px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .ledger .stat-block:last-child { border-bottom: 0; }
  .ledger .stat-line { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--text-secondary); }
  .ledger .stat-line strong { color: var(--text); font-weight: 600; }
  .ledger .file-row { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--text-secondary); }
  .ledger .file-row .mono { font-size: 10px; }
  .ledger .orb { right: 18px; bottom: 118px; width: 38px; height: 38px; }

  /* ---------- entrance ---------- */
  .msg-user, .msg-assistant { animation: enter 240ms var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms); }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) {
    .msg-user, .msg-assistant { animation: none; }
    .dot.run, .spinner { animation: none; }
  }

  /* ---------- picker (spec) ---------- */
  .proto-picker {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2147483647;
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(10, 10, 10, 0.82);
    -webkit-backdrop-filter: blur(12px) saturate(1.4);
    backdrop-filter: blur(12px) saturate(1.4);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.08) inset,
      0 8px 24px rgba(0, 0, 0, 0.24),
      0 2px 6px rgba(0, 0, 0, 0.12);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    line-height: 1;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }
  .proto-picker-highlight {
    position: absolute;
    top: 4px;
    left: 0;
    height: 28px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    will-change: transform;
  }
  .proto-picker[data-ready] .proto-picker-highlight {
    transition:
      transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
      width 250ms cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (prefers-reduced-motion: reduce) {
    .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
  }
  .proto-picker-item {
    position: relative;
    display: flex;
    align-items: center;
    height: 28px;
    padding: 0 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: rgba(255, 255, 255, 0.55);
    font: inherit;
    cursor: pointer;
    transition: color 150ms ease-out;
  }
  .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
  .proto-picker-item:active { transform: scale(0.97); }
  .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
  .proto-picker-item[data-active] { color: #fff; }
  .proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
  .proto-picker-replay { padding: 0 10px; font-size: 14px; }
  .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
</style>
</head>

<script>
  const stage = document.getElementById('stage');
  const picker = document.querySelector('.proto-picker');
  const highlight = picker.querySelector('.proto-picker-highlight');
  const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
  const replay = picker.querySelector('.proto-picker-replay');
  const variants = [...document.querySelectorAll('template.variant')].map((template) => () => template.innerHTML);
  let current = 0;

  function moveHighlight() {
    const el = items[current];
    highlight.style.width = el.offsetWidth + 'px';
    highlight.style.transform = `translateX(${el.offsetLeft}px)`;
  }

  function mount(i) {
    stage.innerHTML = '';
    requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
  }

  function setActive(i) {
    if (i < 0 || i >= variants.length) return;
    current = i;
    items.forEach((el, j) => {
      el.toggleAttribute('data-active', j === i);
      if (j === i) el.setAttribute('aria-current', 'true');
      else el.removeAttribute('aria-current');
    });
    moveHighlight();
    const url = new URL(location);
    url.searchParams.set('v', i + 1);
    history.replaceState(null, '', url);
    mount(i);
  }

  items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
  replay?.addEventListener('click', () => mount(current));
  window.addEventListener('resize', moveHighlight);

  document.addEventListener('keydown', (e) => {
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const num = parseInt(e.key, 10);
    if (num >= 1 && num <= variants.length) setActive(num - 1);
    else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
    else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
    else if (e.key === 'r' || e.key === 'R') mount(current);
  });

  setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
  requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
